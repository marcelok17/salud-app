};

/* Pinta la ruta actual con los datos ya leídos (cambiar de pantalla no vuelve a pedir nada). */
function pintar(){
  const ruta = rutaActual();
  if(ruta === "config" || !cfg.token){ renderConfig(); return; }
  if(!DATOS){ render(); return; }
  const vista = VISTAS[ruta] || VISTAS.inicio;
  const banners = `${bannerSinConexion()}${bannerWithings()}${bannerPendientes(DATOS.estado)}`;
  const rel = DATOS.estado.relojes || {};
  const conHeroe = RUTAS_CON_HEROE.includes(ruta) || !VISTAS[ruta];
  $("#app").innerHTML = conHeroe
    ? `${heroe(rel, DATOS.estado.edad_metabolica)}<main class="panel">${banners}${pestanas(VISTAS[ruta]?ruta:"inicio")}${vista[1]()}</main>${navInferior(ruta)}`
    : `${cabeceraDetalle(vista[0])}<main class="detalle-cuerpo">${banners}${vista[1]()}</main>${navInferior(ruta)}`;
  if(!conHeroe) window.scrollTo(0, 0);
}

/* ---------- pantalla principal: lee el repo y pinta ---------- */
async function render(){
  const app = $("#app");
  if(!cfg.token){ renderConfig(); return; }
  if(!DATOS) app.innerHTML = `${cabecera()}<div class="estado-msg">Leyendo tu repo…</div>`;
  SIN_CONEXION = false; SELLO_CACHE = null;
  PENDIENTES = await BD.todos().catch(()=>[]);
  try{
    // Una sola tanda: el tablero y los 8 días van juntos.
    const fechas=[...Array(8)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return fechaLocal(d);});
    const [est, ...regs] = await Promise.all([
      ghJson("dashboard/estado.json"),
      ...fechas.map(f=>ghJson(`registro/${f}.json`).catch(()=>null)),
    ]);
    if(!est){
      app.innerHTML = `${cabecera()}<div class="detalle-cuerpo"><div class="tarjeta"><p class="analisis">Aún no existe <b>dashboard/estado.json</b>.
        Corre el workflow "Agente de Salud — correo diario" (botón <i>Run workflow</i> en GitHub) y recarga.</p>
        <div class="pie"><button onclick="render()">Recargar</button></div></div></div>`;
      return;
    }
    LIBRE = est.libre || null;
    ULTIMO_REG_CRUDO = regs[0];
    DATOS = {estado: est, regHoy: mezclarLocales(regs[0]), historial: regs.slice(1).filter(Boolean)};
  }catch(e){
    if(esFalloDeRed(e)){
      app.innerHTML = `${cabecera()}<div class="detalle-cuerpo"><div class="tarjeta"><p class="analisis">Sin conexión, y todavía no hay datos guardados
        en este teléfono. Ábrela una vez con señal y desde ahí funciona aunque te quedes sin red.</p>
        ${PENDIENTES.length?`<p class="pendientes">${textoPendientes()}</p>`:""}
        <div class="pie"><button onclick="render()">Reintentar</button></div></div></div>`;
      return;
    }
    app.innerHTML = `${cabecera()}<div class="detalle-cuerpo"><div class="tarjeta"><p class="analisis">No pude leer el repo: ${escaparHtml(e.message)}.</p>
      <div class="pie"><button onclick="ir('config')">Cambiar configuración</button>
      <button onclick="render()">Reintentar</button></div></div></div>`;
    return;
  }
  pintar();
}

window.addEventListener("hashchange", pintar);

/* Por tipo de dato: la última sincronización correcta con Withings y el último dato recibido. */
function tarjetaSincronizacion(){
  const w = estadoWithings();
  const L = (DATOS && DATOS.estado && DATOS.estado.libre) || null;
  const NOM = {peso:"Peso", composicion:"Composición corporal", presion:"Presión", pulso:"Pulso / FC reposo", sueno:"Sueño", actividad:"Actividad", entrenamiento:"Entrenamientos"};
  const filas = w ? Object.keys(NOM).map(k => `<div class="barra"><div class="fila"><span>${NOM[k]}</span>
      <b style="font-size:13px">${(w.ultima_ok||{})[k] ? fechaCorta(w.ultima_ok[k]) + " " + w.ultima_ok[k].slice(11,16) : "nunca"}</b></div>
      <div class="t-sub" style="margin-top:0">último dato: ${(w.ultimo_dato||{})[k] ? fechaCorta(w.ultimo_dato[k]) : "—"}${(w.errores||{})[k==="sueno"?"sueno":k==="actividad"?"actividad":"medidas"] ? " · error en la última consulta" : ""}</div></div>`).join("")
    : `<p class="t-sub">Aún no hay registro de sincronización con Withings.</p>`;
  return `<div class="tarjeta"><h2>Sincronización</h2>
    <p class="t-sub" style="margin-bottom:10px">Withings: ${w && w.conexion ? (w.conexion.ok ? "conectado" : `<b>sin conexión desde el ${fechaCorta(w.sin_conexion_desde)}</b> — ${escaparHtml(w.conexion.motivo||"")}`) : "—"}</p>
    ${filas}
    <div class="barra" style="margin-top:6px"><div class="fila"><span>Sensor de glucosa</span>
      <b style="font-size:13px">${L && L.consultado ? fechaCorta(L.consultado) + " " + L.consultado.slice(11,16) : "—"}</b></div>
      ${L && L.diagnostico ? `<div class="t-sub" style="margin-top:0">${escaparHtml(L.diagnostico)}</div>` : ""}</div>
  </div>`;
}

/* ---------- conectar / reconfigurar ---------- */
function guardarConfig(){
  const token = $("#c-token").value.trim() || cfg.token;   // en blanco = conservar el que ya estaba
  if(!token){ $("#c-aviso").textContent = "Falta el token."; return; }
  cfg.guardar($("#c-owner").value.trim(), $("#c-repo").value.trim(), token);
  DATOS = null;
  location.hash = "inicio";
  render();
}

function renderConfig(){
  const yaConectado = !!cfg.token;
  $("#app").innerHTML = `${cabeceraDetalle(yaConectado ? "Configuración" : "Conectar")}<main class="detalle-cuerpo"><div class="tarjeta config">
    <h2>${yaConectado ? "Configuración" : "Conectar con tu repo"}</h2>
    <p class="ayuda">La app lee tu repo privado <b>agente-salud</b> directo desde este teléfono.
      Necesitas un token: GitHub → Settings → Developer settings →
      <b>Fine-grained tokens</b> → Generate → repositorio <b>agente-salud</b> →
      Permissions → Contents: <b>Read and write</b> y Actions: <b>Read and write</b>
      (la app registra y despierta al agente al instante). El token queda guardado solo en este navegador.</p>
    <input id="c-owner" placeholder="Usuario de GitHub" value="${cfg.owner}">
    <input id="c-repo" placeholder="Nombre del repo" value="${cfg.repo||"agente-salud"}">
    <input id="c-token" type="password" autocomplete="off"
      placeholder="${yaConectado ? "Token guardado — déjalo en blanco para conservarlo" : "Token fine-grained (github_pat_…)"}">
    <div class="ayuda" id="c-aviso" style="color:var(--musc);min-height:14px"></div>
    <button onclick="guardarConfig()">${yaConectado ? "Guardar" : "Conectar"}</button>
    ${yaConectado ? `<div class="pie">
      <button onclick="ir('inicio')">Volver</button>
      <button onclick="if(confirm('¿Borrar el token de este teléfono? Tendrás que ingresarlo de nuevo.')){cfg.borrar();render()}">Desconectar</button>
    </div>` : ""}
    <div class="version">v21.8.0</div>
  </div>${yaConectado ? tarjetaSincronizacion() : ""}</main>${yaConectado ? navInferior("config") : ""}`;
}

/* ---------- app instalable: service worker, actualizaciones e instalacion ---------- */
function bannerSistema(id, texto, etiquetaBoton, alPulsar){
  if(document.getElementById(id)) return;
  const d = document.createElement("div");
  d.id = id; d.className = "banner-sistema banner-nueva";
  d.innerHTML = `<span></span><button></button>`;
  d.querySelector("span").textContent = texto;
  const btn = d.querySelector("button");
  btn.textContent = etiquetaBoton;
  btn.onclick = ()=>alPulsar(d);
  $("#app").before(d);
}

function registrarServiceWorker(){
  // Los service workers solo existen en http(s); abierta como archivo suelto, la app sigue funcionando sin offline.
  if(!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;

  let recargando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(recargando) return; recargando = true; location.reload();
  });

  navigator.serviceWorker.register("sw.js").then(reg=>{
    const ofrecer = trabajador => bannerSistema("banner-nueva",
      "Hay una versión nueva de la app.", "Actualizar",
      d => { d.remove(); trabajador.postMessage({tipo:"actualizar"}); });

    if(reg.waiting && navigator.serviceWorker.controller) ofrecer(reg.waiting);
    reg.addEventListener("updatefound", ()=>{
      const nuevo = reg.installing;
      if(!nuevo) return;
      nuevo.addEventListener("statechange", ()=>{
        if(nuevo.state === "installed" && navigator.serviceWorker.controller) ofrecer(nuevo);
      });
    });
  }).catch(()=>{ /* sin offline, pero la app funciona igual */ });
}

let PROMPT_INSTALAR = null;
window.addEventListener("beforeinstallprompt", ev=>{
  ev.preventDefault(); PROMPT_INSTALAR = ev;
  bannerSistema("banner-instalar", "Instálala para abrirla como app, con su ícono.", "Instalar",
    async d => { d.remove(); PROMPT_INSTALAR.prompt(); await PROMPT_INSTALAR.userChoice; PROMPT_INSTALAR = null; });
});
window.addEventListener("appinstalled", ()=>{
  document.getElementById("banner-instalar")?.remove(); PROMPT_INSTALAR = null;
});

window.addEventListener("online", ()=>{ sincronizarPendientes().then(()=>{ if(SIN_CONEXION) render(); }); });

document.addEventListener("DOMContentLoaded", ()=>{
  registrarServiceWorker();
  if(cfg.token) despertarSiHaceFalta();
  render().then(()=>{ sincronizarPendientes(); if(cfg.token) prepararLector(); });
});
</script>
