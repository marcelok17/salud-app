<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<meta name="description" content="Tu Salud: la flor del bienestar, tu registro diario y el agente que lo interpreta.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Tu Salud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Diseño "Tu Salud" (02-10-2026): la flor es la identidad; Inicio resume y decide, el detalle
     numérico vive en las pantallas de cada tema. Colores por categoría: los mismos en toda la app. */
  :root{
    --fondo:#F7F4EE; --tarjeta:#FFFFFF; --linea:#ECE8E0; --linea2:#F1EEE8; --panel2:#F3F0EA;
    --tinta:#1F2A24; --tinta2:#6F7A73; --acento:#2F6B4F; --acento-suave:#E4EFE7;
    --c-descanso:#5B4FA0; --c-corazon:#D4574A; --c-nutricion:#3E8A4F; --c-metabolismo:#5FA27C;
    --c-cuerpo:#2F6A96; --c-composicion:#C9653F; --c-micros:#D69631; --c-aerobico:#4B7FA8;
    /* nombres que usa el código de siempre (barras, curva, historial) */
    --macros:#D58A2E; --micros:#3E8A4F; --musc:#B8553C; --corazon:#D4574A; --grasa:#2F6A96; --descanso:#5B4FA0;
    --sombra:0 1px 2px rgba(31,42,36,.04), 0 10px 28px rgba(31,42,36,.06);
    --serif:'Libre Caslon Text',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--fondo)}
  body{background:var(--fondo);color:var(--tinta);font-family:var(--sans);max-width:980px;margin:0 auto;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit}
  .ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---- Cabecera ---- */
  .cabecera{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 0;position:relative;z-index:2}
  .heroe-grid{padding:0 18px}
  .logo{width:46px;height:46px;flex:none}
  .marca .nombre{font-family:var(--serif);font-size:29px;line-height:1;letter-spacing:-.01em}
  .marca .lema{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--tinta);margin-top:6px;opacity:.85}
  .cabecera .derecha{margin-left:auto;display:flex;align-items:center;gap:12px}
  .cabecera .hoy{text-align:right;font-size:12.5px;line-height:1.35}
  .cabecera .hoy b{font-weight:500;font-size:13.5px}
  .perfil{width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:var(--sombra);
    display:grid;place-items:center;cursor:pointer}

  /* ---- Héroe: foto + titular + flor ---- */
  .heroe{position:relative;padding:0 0 46px;background:var(--fondo)}   /* fondo sólido, el mismo de la app */
  .heroe-grid{display:grid;grid-template-columns:1fr;gap:6px;align-items:center}
  .heroe h1{font-family:var(--serif);font-weight:400;font-size:33px;line-height:1.1;letter-spacing:-.01em;max-width:13ch}
  .heroe .bajada{font-size:15px;line-height:1.45;color:#3E4A43;margin-top:10px}
  .flor{width:100%;max-width:420px;margin:4px auto 0;display:block;overflow:visible}
  .flor .petalo{cursor:pointer;transition:opacity .35s}
  .flor .centro{cursor:pointer;filter:drop-shadow(0 6px 14px rgba(31,42,36,.16))}
  .flor.foco-energia .petalo:not([data-grupo=energia]),
  .flor.foco-salud .petalo:not([data-grupo=salud]),
  .flor.foco-rendimiento .petalo:not([data-grupo=rendimiento]){opacity:.22}
  .chips-heroe{display:flex;gap:14px;justify-content:center;margin-top:8px}
  .chip-h{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:13px}
  .chip-h .circ{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:var(--sombra);
    display:grid;place-items:center;position:relative}
  .chip-h .circ svg.prog{position:absolute;inset:0;width:56px;height:56px}
  .chip-h.activo .circ{background:#fff;outline:2px solid var(--acento);outline-offset:2px}
  @media (min-width:700px){
    .heroe-grid{grid-template-columns:1fr 1.15fr}
    .heroe h1{font-size:46px}
    .chips-heroe{justify-content:flex-start}
    .heroe .texto{padding-bottom:40px}
  }

  /* ---- Panel de contenido ---- */
  .panel{background:var(--fondo);border-radius:28px 28px 0 0;margin-top:-30px;position:relative;padding:12px 14px 20px}
  .pestanas{display:flex;background:var(--panel2);border-radius:28px;padding:5px;gap:2px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
  .pestanas::-webkit-scrollbar{display:none}
  .pestana{flex:1;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 6px;border:none;
    background:none;border-radius:24px;font-size:12.5px;color:#3E4A43;cursor:pointer;white-space:nowrap}
  .pestana.activa{background:var(--acento);color:#fff}
  .cabecera-detalle{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 12px}
  .cabecera-detalle h1{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.1}
  .volver{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:var(--sombra);display:grid;place-items:center;cursor:pointer}
  .detalle-cuerpo{padding:4px 14px 20px}

  /* ---- Tarjetas ---- */
  .tarjeta{background:var(--tarjeta);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sombra)}
  .rejilla-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;margin-bottom:12px}
  .rejilla-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .rejilla-2>.tarjeta,.rejilla-3>.tarjeta{margin-bottom:0}
  /* En el teléfono, la edad y el registro van uno sobre otro: 4 anillos no caben en media pantalla. */
  @media (max-width:560px){.rejilla-2{grid-template-columns:minmax(0,1fr)}}
  .t-titulo{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;line-height:1.2;color:var(--tinta)}
  .t-titulo .mas{margin-left:auto;color:var(--tinta2);flex:none}
  .rejilla-3>.tarjeta{padding:13px 12px}
  .t-sub{font-size:12px;color:var(--tinta2);margin-top:6px;line-height:1.4}
  a.tarjeta,button.tarjeta{display:block;width:100%;text-align:left;text-decoration:none;color:inherit;border:none;cursor:pointer}
  .estado{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;background:var(--acento-suave);color:var(--acento);white-space:nowrap}
  .estado.atencion{background:#FBEDE6;color:#B4532F}
  .estado.neutro{background:var(--panel2);color:var(--tinta2)}
  .mini{width:100%;height:auto;display:block;margin-top:8px}
  h2{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--tinta);margin-bottom:12px}
  .boton{display:inline-flex;align-items:center;gap:6px;background:var(--acento);color:#fff;border:none;border-radius:999px;
    padding:8px 14px;font-size:13.5px;font-weight:500;cursor:pointer}
  .anillos4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px;text-align:center}
  .anillos4 .a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--tinta2);min-width:0}
  .anillos4 .r{position:relative;width:100%;max-width:62px}
  .anillos4 .r>svg{width:100%;height:auto;display:block}
  .anillos4 .ic{position:absolute;inset:0;display:grid;place-items:center}
  .anillos4 .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aviso-medico{display:flex;align-items:center;gap:12px;font-size:13.5px;line-height:1.4}
  .aviso-medico .ico{color:var(--c-corazon)}
  .habitos{background:var(--panel2);border-radius:22px;padding:14px;margin-bottom:12px}
  .habitos .cab{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .habitos .cab .t-titulo{font-size:18px}
  .habitos .cab small{margin-left:auto;font-size:12px;color:var(--tinta2)}
  .habito{background:#fff;border-radius:16px;padding:12px 10px;box-shadow:var(--sombra);position:relative;min-width:0}
  .habito .f{display:flex;align-items:center;gap:5px;font-size:12.5px;min-width:0;padding-right:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .habito .ok{position:absolute;top:10px;right:9px;width:20px;height:20px;border-radius:50%;border:1.5px solid #CFCBC3;display:grid;place-items:center}
  .habito .ok.si{background:var(--acento);border-color:var(--acento);color:#fff}
  .habito .p{height:5px;border-radius:4px;background:var(--linea2);margin:12px 0 8px;overflow:hidden}
  .habito .p i{display:block;height:100%;border-radius:4px}
  .habito .c{font-size:11px;color:var(--tinta2);line-height:1.35}
  .lista-mas a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--linea2);
    color:var(--tinta);text-decoration:none;font-size:15px}
  .lista-mas a:last-child{border-bottom:none}
  .lista-mas a .mas{margin-left:auto;color:var(--tinta2)}
  .fila-arbol{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--linea2)}
  .fila-arbol:last-child{border-bottom:none}
  .fila-arbol i{width:12px;height:12px;border-radius:50%;margin-top:4px}
  .fila-arbol .n{font-size:15px;font-weight:500}
  .fila-arbol .d{font-size:12.5px;color:var(--tinta2);margin-top:3px;line-height:1.45}
  .fila-arbol .s{font-family:var(--serif);font-size:18px}
  .metricas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .metrica{background:var(--panel2);border-radius:14px;padding:10px 12px}
  .metrica .v{font-family:var(--serif);font-size:21px}
  .metrica .l{font-size:11.5px;color:var(--tinta2);margin-top:2px}
  .nota{font-size:12px;color:var(--tinta2);line-height:1.5;margin-top:10px}

  /* ---- Navegación inferior ---- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:980px;margin:0 auto;background:#fff;
    border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(31,42,36,.07);display:grid;grid-template-columns:repeat(5,1fr);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.15;text-align:center;color:var(--tinta2);text-decoration:none;padding:6px 0}
  .nav a.activa{color:var(--acento)}
  .nav .fab{justify-self:center;width:60px;height:60px;border-radius:50%;background:var(--acento);color:#fff;
    display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 20px rgba(47,107,79,.35);padding:0}
  .nav .fab .ico{width:28px;height:28px;stroke-width:2}

  /* ---- Piezas que ya existían (registro, listas, detalle) ---- */
  .barra{margin-bottom:14px}
  .barra .fila{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px;color:var(--tinta2);gap:8px}
  .barra .fila b{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--tinta);text-align:right}
  .pista{height:6px;background:var(--linea2);border-radius:4px;overflow:hidden}
  .pista i{display:block;height:100%;border-radius:4px}
  .rutina{font-size:15.5px;line-height:1.6}
  .rutina b{color:var(--acento);font-weight:600}
  ul.objetivos{list-style:none}
  ul.objetivos li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linea2);font-size:14.5px;line-height:1.45}
  ul.objetivos li:last-child{border-bottom:none;padding-bottom:2px}
  ul.objetivos input{width:18px;height:18px;accent-color:var(--acento);margin-top:1px;flex:none}
  li.hecho label{color:var(--tinta2);text-decoration:line-through}
  .analisis{font-size:14.5px;line-height:1.6}
  .alerta{margin-top:12px;background:#FBF1EA;border:1px solid #EBCDB8;color:#8A4F2B;border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5}
  .config input{width:100%;background:#FAF9F6;border:1px solid var(--linea);color:var(--tinta);border-radius:12px;padding:12px 13px;font-size:15px;margin-bottom:10px}
  .config button,.recargar{width:100%;background:var(--acento);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
  .config .ayuda{font-size:13px;color:var(--tinta2);line-height:1.55;margin-bottom:12px}
  .estado-msg{color:var(--tinta2);font-size:14px;text-align:center;padding:36px 0}
  .pie{display:flex;gap:10px;margin-top:4px}
  .pie button{flex:1;background:transparent;border:1px solid var(--linea);color:var(--tinta2);border-radius:12px;padding:10px;font-size:13px;cursor:pointer}
  a{color:var(--acento)}
  .dia-fila{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea2)}
  .dia-fila:last-child{border-bottom:none}
  .dia-fecha{text-align:center}
  .dia-fecha .d{font-family:var(--serif);font-size:23px;line-height:1}
  .dia-fecha .m{font-size:10px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  .dia-datos{font-size:12.5px;color:var(--tinta2);line-height:1.55}
  .dia-datos b{color:var(--tinta);font-weight:600}
  .dia-marcas{display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-size:11px}
  .chip{border-radius:20px;padding:3px 9px;font-weight:600;letter-spacing:.03em}
  .chip.gym{background:#E8EFF5;color:var(--c-cuerpo)}
  .chip.peso{background:#F7EAE3;color:var(--c-composicion)}
  .chip.hipo{background:#FBF1EA;color:#8A4F2B}
  .glu-ok{color:var(--c-nutricion)} .glu-baja{color:#B07A2E;font-weight:600} .glu-alta{color:var(--c-corazon);font-weight:600}
  .corr{border-left:2px solid var(--linea);padding:11px 14px;margin-bottom:11px;border-radius:0 12px 12px 0;background:#FAF9F6}
  .corr.medica{border-left-color:var(--c-corazon)} .corr.accion{border-left-color:var(--c-micros)} .corr.info{border-left-color:var(--c-cuerpo)}
  .corr .s{font-weight:600;font-size:14px}
  .corr .e{font-size:12px;color:var(--tinta2);margin:4px 0}
  .corr .h{font-size:13.5px;line-height:1.5;margin:4px 0}
  .corr .a{font-size:13px;color:var(--acento)}
  .registrar textarea{width:100%;background:#FAF9F6;border:1px solid var(--linea);color:var(--tinta);border-radius:14px;
    padding:13px 14px;font-size:15px;line-height:1.5;min-height:112px;resize:vertical;font-family:inherit}
  .registrar textarea::placeholder{color:var(--tinta2);opacity:.75}
  .reg-ayuda{font-size:12.5px;color:var(--tinta2);margin-top:8px;line-height:1.45}
  .reg-entendi{font-size:13px;line-height:1.45;margin-top:8px}
  .reg-entendi:empty{display:none}
  .reg-entendi .asumido{color:var(--tinta2);font-size:12px}
  .reg-fila{display:flex;gap:8px;margin-top:10px}
  .reg-fila label{flex:0 0 auto;background:#FAF9F6;border:1px solid var(--linea);color:var(--tinta2);border-radius:12px;padding:11px 15px;font-size:14px;cursor:pointer;display:grid;place-items:center}
  .reg-fila button{flex:1;background:var(--acento);color:#fff;border:none;border-radius:12px;padding:11px;font-size:14.5px;font-weight:600;cursor:pointer}
  .reg-fila button:disabled{opacity:.5}
  .reg-fotos{font-size:12.5px;color:var(--tinta2);margin-top:7px}
  .resp-agente{margin-top:14px;border-top:1px solid var(--linea2);padding-top:12px;font-size:14px;line-height:1.55}
  .resp-agente .hora{font-size:11px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
  .banner-carbs{background:#FBF5E8;border:1px solid #EADBB4;color:#7C6224;border-radius:16px;padding:12px 15px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
  .banner-sistema{border-radius:16px;padding:11px 15px;font-size:13px;line-height:1.45;margin:0 14px 12px;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .panel .banner-sistema,.detalle-cuerpo .banner-sistema{margin:0 0 12px}
  .banner-offline{background:#F1F2F1;border:1px solid #DFE2DF;color:#4A5550}
  .banner-nueva{background:var(--acento-suave);border:1px solid #CBE0D3;color:var(--acento)}
  .banner-espera{background:#FBF5E8;border:1px solid #EADBB4;color:#7C6224;display:block}
  .banner-sistema button{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .pendientes{font-size:12.5px;color:var(--tinta2);margin-top:7px}
  .version{text-align:center;font-size:10.5px;color:var(--tinta2);letter-spacing:.1em;margin-top:14px;opacity:.65}
  .solo-ancho{display:none}
  @media (min-width:700px){.solo-ancho{display:block}.solo-angosto{display:none}}
  @media (prefers-reduced-motion:reduce){.flor .petalo{transition:none}}
</style>

<body>
<div id="app"><div class="estado-msg">Cargando…</div></div>

<script src="lector.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const cfg = {
  get owner(){return localStorage.getItem("gh_owner")||""},
  get repo(){return localStorage.getItem("gh_repo")||""},
  get token(){return localStorage.getItem("gh_token")||""},
  guardar(o,r,t){localStorage.setItem("gh_owner",o);localStorage.setItem("gh_repo",r);localStorage.setItem("gh_token",t)},
  borrar(){["gh_owner","gh_repo","gh_token"].forEach(k=>localStorage.removeItem(k))}
};

let SIN_CONEXION = false;   // algun dato de esta pasada salio de la cache
let SELLO_CACHE = null;     // el mas viejo de esos datos, para decir de cuando son

async function ghJson(ruta){
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${ruta}`,{
    // GitHub marca sus respuestas max-age=60: sin esto el navegador devolvía la copia
    // guardada durante un minuto, y la respuesta del agente aparecía hasta 60 s tarde.
    // no-cache revalida con ETag: si nada cambió, GitHub responde 304 sin gastar cuota.
    cache: "no-cache",
    headers:{Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github.raw+json"}});
  if(r.headers.get("X-Salud-Offline")){
    SIN_CONEXION = true;
    const sello = +(r.headers.get("X-Salud-Cacheado")||0);
    if(sello && (SELLO_CACHE===null || sello < SELLO_CACHE)) SELLO_CACHE = sello;
  }
  if(r.status===504) throw Object.assign(new Error("sin conexión"), {offline:true});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(`GitHub respondió ${r.status} al pedir ${ruta}`);
  return r.json();
}

function esFalloDeRed(e){
  return !navigator.onLine || e.offline === true || e.name === "TypeError";
}

async function ghPut(ruta, objeto, mensaje){
  const contenido = btoa(unescape(encodeURIComponent(JSON.stringify(objeto))));
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${ruta}`,{
    method:"PUT",
    headers:{Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json"},
    body: JSON.stringify({message: mensaje, content: contenido})});
  if(!r.ok) throw new Error(`GitHub respondió ${r.status} al escribir`);
}

/* ---------- cola de lo que se registro sin senal ---------- */
const BD = {
  abrir(){
    return new Promise((ok,mal)=>{
      const s = indexedDB.open("salud", 1);
      s.onupgradeneeded = ()=>{ if(!s.result.objectStoreNames.contains("pendientes"))
        s.result.createObjectStore("pendientes",{keyPath:"id"}); };
      s.onsuccess = ()=>ok(s.result);
      s.onerror = ()=>mal(s.error);
    });
  },
  async _tx(modo, fn){
    const db = await BD.abrir();
    return new Promise((ok,mal)=>{
      const t = db.transaction("pendientes", modo);
      const pedido = fn(t.objectStore("pendientes"));
      t.oncomplete = ()=>ok(pedido ? pedido.result : undefined);
      t.onerror = ()=>mal(t.error);
      t.onabort = ()=>mal(t.error);
    });
  },
  guardar(e){ return BD._tx("readwrite", st=>st.put(e)); },
  borrar(id){ return BD._tx("readwrite", st=>st.delete(id)); },
  todos(){ return BD._tx("readonly", st=>st.getAll()); }
};

let PENDIENTES = [];

function textoPendientes(){
  const n = PENDIENTES.length;
  if(!n) return "";
  return `${n} registro${n>1?"s":""} esperando señal — se ${n>1?"envían":"envía"} solo${n>1?"s":""} al reconectar.`;
}

async function refrescarPendientes(){
  PENDIENTES = await BD.todos().catch(()=>[]);
  const caja = $("#reg-pendientes");
  if(caja) caja.textContent = textoPendientes();
}

async function sincronizarPendientes(){
  if(!navigator.onLine || !cfg.token) return 0;
  let enviados = 0;
  for(const e of await BD.todos().catch(()=>[])){
    try{
      await ghPut(e.ruta, e.cuerpo, e.mensaje);
      await BD.borrar(e.id);
      enviados++;
    }catch(err){
      if(esFalloDeRed(err)) break;                 // sigue sin senal: se reintenta la proxima
      e.intentos = (e.intentos||0) + 1;            // error real (token, permisos): no insistir para siempre
      if(e.intentos >= 5) await BD.borrar(e.id); else await BD.guardar(e);
      break;
    }
  }
  await refrescarPendientes();
  if(enviados){
    localStorage.setItem("ultimo_dispatch", Date.now());
    ghDispatch();
    render();
  }
  return enviados;
}

/* Fecha local en formato AAAA-MM-DD. Con toISOString() se usaria UTC, y desde las
   20:00 de Chile eso ya es manana: la app buscaria un registro inexistente. */
function fechaLocal(d){
  const f = d || new Date();
  const dosDig = n => String(n).padStart(2, "0");
  return `${f.getFullYear()}-${dosDig(f.getMonth()+1)}-${dosDig(f.getDate())}`;
}

let FOTOS_PENDIENTES = [];

/* Fecha real en que se sacó la foto, leída del EXIF (etiqueta DateTimeOriginal).
   Sin esto, subir hoy la foto del almuerzo de ayer la registraba como de hoy. */
function fechaExifDeJpeg(buffer){
  try{
    const v = new DataView(buffer);
    if(v.getUint16(0) !== 0xFFD8) return null;              // no es JPEG
    let off = 2;
    while(off + 4 < v.byteLength){
      const marca = v.getUint16(off);
      if((marca & 0xFF00) !== 0xFF00) return null;
      const largo = v.getUint16(off + 2);
      if(marca === 0xFFE1){                                  // APP1: aquí vive el EXIF
        const ini = off + 4;
        if(v.getUint32(ini) !== 0x45786966) return null;      // "Exif"
        const tiff = ini + 6;
        const le = v.getUint16(tiff) === 0x4949;              // orden de bytes
        const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
        let ifd = tiff + u32(tiff + 4);
        for(let vuelta = 0; vuelta < 2; vuelta++){            // IFD0 y luego el sub-IFD Exif
          const n = u16(ifd);
          let subExif = null;
          for(let i = 0; i < n; i++){
            const e = ifd + 2 + i * 12, tag = u16(e);
            if(tag === 0x8769) subExif = tiff + u32(e + 8);
            if(tag === 0x9003 || tag === 0x0132){             // DateTimeOriginal / DateTime
              const p = tiff + u32(e + 8);
              let txt = "";
              for(let k = 0; k < 19; k++) txt += String.fromCharCode(v.getUint8(p + k));
              const m = txt.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}:\d{2}:\d{2})$/);
              return m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}` : null;
            }
          }
          if(!subExif) return null;
          ifd = subExif;
        }
        return null;
      }
      off += 2 + largo;
    }
  }catch(e){ /* EXIF ilegible: se usa la fecha del archivo */ }
  return null;
}

function base64DeBuffer(buffer){
  const bytes = new Uint8Array(buffer);
  let binario = "";
  for(let i = 0; i < bytes.length; i += 0x8000){             // por trozos: fromCharCode tiene tope
    binario += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(binario);
}

/* La zona del teléfono. Si Marcelo viaja, sus registros se fechan con la hora
   del lugar donde está — no con la de Chile. */
function zonaDelTelefono(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || null; }
  catch(e){ return null; }
}

function fechaHoraLocal(d){
  const dosDig = n => String(n).padStart(2, "0");
  return `${fechaLocal(d)}T${dosDig(d.getHours())}:${dosDig(d.getMinutes())}:${dosDig(d.getSeconds())}`;
}

function elegirFotos(ev){
  FOTOS_PENDIENTES = [];
  const archivos = [...ev.target.files].slice(0, 5);
  let pendientes = archivos.length;
  if(!pendientes){ $("#reg-fotos").textContent = ""; return; }
  archivos.forEach(a => {
    const lector = new FileReader();
    lector.onload = () => {
      const buffer = lector.result;
      // EXIF primero; si la foto no lo trae, la fecha del archivo suele ser la de captura.
      const tomada = fechaExifDeJpeg(buffer) || fechaHoraLocal(new Date(a.lastModified || Date.now()));
      FOTOS_PENDIENTES.push({media_type: a.type || "image/jpeg", b64: base64DeBuffer(buffer), tomada});
      if(--pendientes === 0){
        const dias = [...new Set(FOTOS_PENDIENTES.map(f => f.tomada.slice(0, 10)))];
        const hoy = fechaLocal();
        const aviso = (dias.length === 1 && dias[0] !== hoy)
          ? ` · del ${dias[0].slice(8)}/${dias[0].slice(5,7)}, se registra en ese día`
          : "";
        $("#reg-fotos").textContent = `${FOTOS_PENDIENTES.length} foto(s) lista(s)${aviso}`;
        previsualizar();
      }
    };
    lector.readAsArrayBuffer(a);
  });
}

async function ghDispatch(){
  try{
    const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/actions/workflows/registro-correo.yml/dispatches`,{
      method:"POST",
      headers:{Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json"},
      body: JSON.stringify({ref:"main"})});
    if(r.ok) return {ok:true};
    if(r.status===403) return {ok:false, motivo:"al token le falta el permiso «Actions: Read and write»"};
    if(r.status===404) return {ok:false, motivo:"no encuentro el workflow en el repo (¿nombre o rama distintos?)"};
    if(r.status===401) return {ok:false, motivo:"el token no es válido o expiró"};
    return {ok:false, motivo:`GitHub respondió ${r.status}`};
  }catch(e){
    return {ok:false, motivo:"sin conexión"};
  }
}

/* Al abrir la app solo se despierta al agente si hay trabajo: registros esperando en el
   repo, o un tablero de hace más de una hora (para traer Withings). Antes lo despertaba
   siempre, y como GitHub corre una ejecución a la vez, el registro que hacías justo
   después de abrir quedaba en la fila detrás de esa corrida vacía. */
async function despertarSiHaceFalta(){
  const ultimo = +(localStorage.getItem("ultimo_dispatch")||0);
  if(Date.now() - ultimo < 5*60*1000) return;
  const [lista, estado] = await Promise.all([
    ghJson("entradas").catch(() => null),
    ghJson("dashboard/estado.json").catch(() => null),
  ]);
  const hayEsperando = Array.isArray(lista) && lista.some(x => x.type === "file" && x.name.endsWith(".json"));
  const generado = Date.parse((estado && estado.generado) || "");
  const tableroViejo = !generado || Date.now() - generado > 60*60*1000;
  if(!hayEsperando && !tableroViejo) return;
  localStorage.setItem("ultimo_dispatch", Date.now());
  ghDispatch();
}

/* Varias casillas seguidas = un solo aviso al agente. Cinco avisos en un segundo no
   aceleran nada (GitHub corre una ejecución a la vez) y compiten entre sí. */
let TEMPORIZADOR_DESPERTAR = null;
const NOMBRES_POR_CONFIRMAR = [];
function despertarAgrupado(nombre){
  NOMBRES_POR_CONFIRMAR.push(nombre);
  clearTimeout(TEMPORIZADOR_DESPERTAR);
  TEMPORIZADOR_DESPERTAR = setTimeout(async () => {
    const nombres = NOMBRES_POR_CONFIRMAR.splice(0).join(", ");
    localStorage.setItem("ultimo_dispatch", Date.now());
    const despertar = await ghDispatch();
    avisoRegistro(despertar.ok
      ? `Registrado: ${nombres}. Se suma al día en un momento…`
      : `Registrado: ${nombres}, pero no pude despertar al agente: ${despertar.motivo}.`);
    if(despertar.ok) esperarRespuesta($("#reg-btn"));
  }, 2500);
}

/* ---------- el lector: lo conocido se registra al instante, sin IA ---------- */
let LECTOR = null;   // tus productos + la tabla estándar, listos para buscar

async function prepararLector(){
  if(typeof Lector === "undefined") return;

    const [tabla, mios] = await Promise.all([

function leerRegistro(texto){
  return (LECTOR && texto.trim()) ? Lector.leer(texto, LECTOR) : null;
}

const escaparHtml = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let TEMPORIZADOR_VISTA = null;
function previsualizar(){
  clearTimeout(TEMPORIZADOR_VISTA);
  TEMPORIZADOR_VISTA = setTimeout(() => {
    const caja = $("#reg-entendi"), campo = $("#reg-texto");
    if(!caja || !campo) return;
    if(FOTOS_PENDIENTES.length){ caja.textContent = "Con foto: la analiza la IA."; return; }
    if(/^\s*(mi\s+)?((cintura|vo2\s*max|examen|triglic[eé]ridos?|hdl|tg)\b[\s\d.,:/-]*(cm|de|del|y|es|mide|mg\/?dl)?\s*)+$/i.test(campo.value)
       || /^\s*\d{2,3}([.,]\d)?\s*(cm)?\s*(de\s+)?cintura\s*$/i.test(campo.value)){
      caja.textContent = (/triglic|hdl|\btg\b/i.test(campo.value) && !/examen/i.test(campo.value))
        ? "Examen: agrega la fecha (ej. «examen 15-09 triglicéridos 140 hdl 42») para registrarlo sin IA."
        : "Medición para tu edad metabólica: se registra sin IA.";
      return;
    }
    const r = leerRegistro(campo.value);
    if(!r){ caja.textContent = ""; return; }
    if(r.ruta !== "local"){ caja.textContent = `Lo analiza la IA (${r.motivo}).`; return; }
    const t = Lector.sumar(r.items);
    const asumido = r.items.some(i => i.asumido);
    caja.innerHTML = `Sin IA: ${r.items.map(i => escaparHtml(Lector.describir(i))).join(" · ")}
      — <b>${Math.round(t.kcal)} kcal · ${Math.round(t.proteina_g)} g proteína</b>`
      + (asumido ? `<br><span class="asumido">"Porción estándar": si fue otra cantidad, escríbela (ej. "150 g", "2 tazas").</span>` : "");
  }, 180);
}

/* Lo registrado sin IA se ve al instante en las barras, antes de que el agente lo guarde en
   GitHub. Cuando el registro del día ya lo incluye (entradas_aplicadas), se deja de sumar aquí. */
const CLAVE_LOCALES = "locales_sin_confirmar";
function leerLocales(){ try{ return JSON.parse(localStorage.getItem(CLAVE_LOCALES) || "[]"); }catch(e){ return []; } }
function recordarLocal(id, items){
  const lista = leerLocales();
  lista.push({id, fecha: fechaLocal(), items});
  localStorage.setItem(CLAVE_LOCALES, JSON.stringify(lista.slice(-30)));
}
function mezclarLocales(reg){
  const hoy = fechaLocal();
  const aplicadas = new Set((reg && reg.entradas_aplicadas) || []);
  const vigentes = leerLocales().filter(x => x.fecha === hoy && !aplicadas.has(x.id));
  localStorage.setItem(CLAVE_LOCALES, JSON.stringify(vigentes));
  if(!vigentes.length) return reg;
  const r = JSON.parse(JSON.stringify(reg || {fecha: hoy, comidas: [], acumulado: {}}));
  r.acumulado = r.acumulado || {}; r.comidas = r.comidas || [];
  for(const x of vigentes) for(const it of x.items){
    r.comidas.push({hora: "recién", ...it});
    for(const c of Lector.CAMPOS) r.acumulado[c] = Math.round(((r.acumulado[c] || 0) + (it[c] || 0)) * 10) / 10;
  }
  return r;
}

let ULTIMO_REG_CRUDO = null;
let LIBRE = null;   // estado del sensor (dashboard/estado.json → libre)
/* Lo registrado sin IA se ve al instante: solo se repintan los anillos y las barras del día,
   nunca la pantalla entera (borraría el mensaje de confirmación del formulario). */
function repintarHoy(){
  const reg = mezclarLocales(ULTIMO_REG_CRUDO);
  if(DATOS) DATOS.regHoy = reg;
  const caja = document.getElementById("hoy-en-vivo");
  if(caja) caja.innerHTML = anillosRegistro(reg);
  const barras = document.getElementById("barras-hoy");
  if(barras) barras.innerHTML = barrasNutrientes(reg);
}

let TEMPORIZADOR_SILENCIO = null;
function despertarEnSilencio(){   // guardar en GitHub sin hacerte esperar
  clearTimeout(TEMPORIZADOR_SILENCIO);
  TEMPORIZADOR_SILENCIO = setTimeout(() => { localStorage.setItem("ultimo_dispatch", Date.now()); ghDispatch(); }, 2500);
}

async function enviarRegistro(){
  const texto = $("#reg-texto").value.trim();
  if(!texto && !FOTOS_PENDIENTES.length) return;
  const btn = $("#reg-btn"); btn.disabled = true; btn.textContent = "Guardando…";
  avisoRegistro("");
  const id = new Date().toISOString().replace(/[:.]/g,"-");
  const lectura = FOTOS_PENDIENTES.length ? null : leerRegistro(texto);
  const sinIA = !!(lectura && lectura.ruta === "local");
  const items = sinIA ? lectura.items.map(i => ({descripcion: Lector.describir(i), fuente: i.fuente, ...i.nutrientes})) : null;
  const entrada = {id, ruta:`entradas/${id}.json`,
                   cuerpo:{texto, fotos: FOTOS_PENDIENTES, zona: zonaDelTelefono(),
                           hora_local: fechaHoraLocal(new Date()),
                           ...(sinIA ? {origen: "tabla", items_comida: items} : {})},
                   mensaje:`entrada app ${id}`};
  const limpiar = ()=>{ $("#reg-texto").value = ""; FOTOS_PENDIENTES = []; $("#reg-fotos").textContent = "";
                        const c = $("#reg-entendi"); if(c) c.textContent = ""; };
  const avisoSinIA = extra => {
    const t = Lector.sumar(lectura.items);
    avisoRegistro(`Registrado al instante, sin IA: ${lectura.items.map(i => Lector.describir(i)).join(" · ")} `
      + `— ${Math.round(t.kcal)} kcal · ${Math.round(t.proteina_g)} g proteína.${extra || ""}`);
  };
  if(sinIA){
    // Se muestra ya: el guardado en GitHub va por detrás.
    recordarLocal(id, items);
    limpiar();
    avisoSinIA();
    btn.textContent = "Guardar"; btn.disabled = false;
    repintarHoy();
    try{
      await ghPut(entrada.ruta, entrada.cuerpo, entrada.mensaje);
      despertarEnSilencio();
    }catch(e){
      if(esFalloDeRed(e)){
        await BD.guardar(entrada).catch(()=>{});
        await refrescarPendientes();
        avisoSinIA(" Sin señal: se sube solo al volver.");
      }else{
        avisoSinIA(` No pude guardarlo en GitHub (${e.message}); reintenta.`);
      }
    }
    return;
  }
  try{
    await ghPut(entrada.ruta, entrada.cuerpo, entrada.mensaje);
    limpiar();
    localStorage.setItem("ultimo_dispatch", Date.now());
    btn.textContent = "El agente está trabajando…";
    const despertar = await ghDispatch();
    if(despertar.ok){
      esperarRespuesta(btn);
    }else{
      btn.textContent = "Guardar"; btn.disabled = false;
      avisoRegistro(`Guardado ✓ — pero no pude despertar al agente: ${despertar.motivo}. `
        + "Tu registro está a salvo; se procesará cuando GitHub corra el workflow programado, "
        + "que puede tardar horas.");
    }
  }catch(e){
    if(esFalloDeRed(e)){
      try{
        await BD.guardar(entrada);
        limpiar();
        await refrescarPendientes();
        btn.textContent = "Guardar"; btn.disabled = false;
        avisoRegistro("Guardado en el teléfono ✓ — se envía solo cuando vuelva la señal.");
        return;
      }catch(e2){ /* si tampoco se pudo guardar aqui, cae al error normal */ }
    }
    btn.textContent = "Error: " + e.message; btn.disabled = false;
  }
}

async function esperarRespuesta(btn){
  // Desde Medicación no hay botón de Guardar en pantalla: se espera igual, sin tocarlo.
  btn = btn || {set textContent(v){}, set disabled(v){}};
  // Sondeo rapido al principio (el agente suele tardar 15-25 s) y tranquilo despues,
  // para no gastar cuota de API esperando algo que ya se demoro.
  const rutaHoy = () => `registro/${fechaLocal()}.json`;
  const antes = JSON.stringify((await ghJson(rutaHoy()).catch(()=>null))?.respuestas_agente || []);
  const inicio = Date.now();

  const revisar = async () => {
    const transcurrido = Date.now() - inicio;
    if(transcurrido > 180000){                       // 3 minutos: nos rendimos
      btn.textContent = "Guardar"; btn.disabled = false;
      avisoRegistro("Guardado ✓ — tu registro está a salvo en el repo. El agente todavía "
        + "no lo procesa; su respuesta aparecerá acá cuando lo haga.");
      return;
    }
    const reg = await ghJson(rutaHoy()).catch(()=>null);
    if(JSON.stringify(reg?.respuestas_agente || []) !== antes){
      btn.textContent = "Guardar"; btn.disabled = false;
      render();                                      // la respuesta ya llego
      return;
    }
    setTimeout(revisar, transcurrido < 60000 ? 2000 : 10000);
  };
  setTimeout(revisar, 2000);
}

function avisoRegistro(texto){

}

Dormí 7 horas · Glucosa 95 en ayunas · Peso 97,2" oninput="previsualizar()"></textarea>

function bannerPendientes(estado){
  const p = (estado && estado.entradas_pendientes) || [];
  if(!p.length) return "";
  const motivos = [...new Set(p.map(x => x.motivo))];
  const n = p.length;
  // Un registro en pausa NO se reintenta solo (se pausó para no seguir cobrando):
  // decir "se procesan solos" ahí sería mentir.
  const enPausa = p.some(x => /en pausa/i.test(x.motivo || ""));
  const titulo = enPausa ? `en pausa` : `esperando a la IA`;
  const cierre = enPausa ? "" : " Nada se pierde: se procesan solos al reintentar.";
  return `<div class="banner-sistema banner-espera">
    <span><b>${n} registro${n>1?"s":""} ${titulo}.</b> ${motivos[0]}
    ${n>1?` (y ${n-1} más en la misma cola)`:""}${cierre}</span>
  </div>`;
}

function bannerSinConexion(){

  }

}

function bannerCarbs(regHoy, estado){
  // El piso de 75 g es una regla de Jardiance: con Jardiance pausado (keto en curso) no aplica.
  if(!/^jardiance/.test(((estado.regla_carbos)||{}).modo||"")) return "";
  const h = new Date().getHours();
  if(h<17||h>=22) return "";
  const rutina = (estado.rutina_de_hoy||"").toUpperCase();
  if(rutina.includes("DESCANSO")) return "";
  const carbs = ((regHoy&&regHoy.acumulado)||{}).carbohidratos_g||0;
  if(carbs>=40) return "";
  return `<div class="banner-carbs">Van <b>${Math.round(carbs)} g</b> de carbohidratos y hoy es día de entrenamiento —
    el piso con Jardiance es 75 g. La cena es el momento: legumbres, papa o arroz.</div>`;
}

/* ---------- checklist con memoria del día ---------- */
const LISTAS = {};   // lo que muestra cada checklist, para saber que se marco

function checklist(items, claveBase){
  LISTAS[claveBase] = items;
  const hoy = fechaLocal();
  return `<ul class="objetivos">` + items.map((txt,i)=>{
    const clave = `chk_${claveBase}_${hoy}_${i}`;
    const marcado = localStorage.getItem(clave)==="1";
    return `<li class="${marcado?"hecho":""}">
      <input type="checkbox" id="${clave}" ${marcado?"checked":""}
        onchange="marcarItem('${claveBase}',${i},this.checked)">
      <label for="${clave}">${txt}</label></li>`;
  }).join("") + `</ul>`;
}

/* Marcar un medicamento o suplemento no es solo un recordatorio: lo REGISTRA,
   para que sus micronutrientes entren en el acumulado del dia. Antes la marca
   se quedaba en el navegador y la barra de magnesio seguia en cero. */
async function marcarItem(claveBase, i, marcado){
  const clave = `chk_${claveBase}_${fechaLocal()}_${i}`;
  localStorage.setItem(clave, marcado ? "1" : "0");
  const casilla = document.getElementById(clave);
  if(casilla && casilla.closest("li")) casilla.closest("li").classList.toggle("hecho", marcado);

  if(claveBase === "obj" || !marcado) return;        // los objetivos del dia no se registran
  const yaEnviado = `enviado_${clave}`;
  if(localStorage.getItem(yaEnviado)) return;        // desmarcar y volver a marcar no cuenta doble
  const nombre = (LISTAS[claveBase] || [])[i];
  if(!nombre) return;

  localStorage.setItem(yaEnviado, "1");
  const id = new Date().toISOString().replace(/[:.]/g,"-");
  const entrada = {id, ruta:`entradas/${id}.json`,
                   cuerpo:{texto:`Tomé ${nombre}`, fotos:[], origen:"casilla", item: nombre,
                           lista: claveBase, zona: zonaDelTelefono(),
                           hora_local: fechaHoraLocal(new Date())},
                   mensaje:`entrada app ${id}`};
  try{
    await ghPut(entrada.ruta, entrada.cuerpo, entrada.mensaje);
    avisoRegistro(`Registrado: ${nombre}…`);
    despertarAgrupado(nombre);
  }catch(e){
    if(esFalloDeRed(e)){
      await BD.guardar(entrada).catch(()=>{});
      await refrescarPendientes();
      avisoRegistro(`${nombre} guardado en el teléfono — se envía al reconectar.`);
    }else{
      localStorage.removeItem(yaEnviado);            // fallo real: que se pueda reintentar
      avisoRegistro(`No pude registrar ${nombre}: ${e.message}`);
    }
  }
}

/* Sensor: la ultima lectura con SU hora y cuanto hace de ella. Nunca se presenta como
   "ahora": el grafico llega cuando corre el agente, a veces con horas de atraso. */
function sensorHoy(reg){
  const serie = (reg&&reg.glucosa_sensor)||[];
  let ult = serie.length ? serie[serie.length-1] : null;
  const delTablero = LIBRE && LIBRE.ultimo;
  if(delTablero && (!ult || delTablero.t > ult.t)) ult = delTablero;
  const diag = LIBRE && LIBRE.diagnostico;
  if(!ult && !diag) return "";
  const clase = v => v<70?"glu-baja":(v>180?"glu-alta":"glu-ok");
  let linea = "";
  if(ult){
    const min = Math.max(0, Math.round((Date.now() - new Date(ult.t).getTime())/60000));
    const hace = min < 60 ? `hace ${min} min` : (min < 1440 ? `hace ${Math.floor(min/60)} h ${min%60} min` : `hace ${Math.floor(min/1440)} d`);
    const hora = new Date(ult.t).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
    const dudosa = ult.calidad && ult.calidad !== "ok";
    linea = `<b class="${dudosa?"":clase(ult.mg_dl)}">${ult.mg_dl} mg/dl · ${hora}${dudosa?" (dudosa)":""}</b>`;
    linea += `</div><div style="font-size:12px;color:var(--tinta2)">Última lectura del sensor ${hace} · ${serie.length} lectura${serie.length===1?"":"s"} hoy`;
    /* Marcadas, no escondidas: no cuentan para el anillo ni las alertas, pero se ven. */
    const art = serie.filter(p=>p.calidad==="artefacto").length;
    const baja = serie.filter(p=>p.calidad==="baja_confianza").length;
    if(art) linea += ` · ${art} artefacto${art===1?"":"s"} (compresión nocturna)`;
    if(baja) linea += ` · ${baja} de baja confianza (sensor nuevo)`;
  }
  return `<div class="barra"><div class="fila"><span>Glucosa (sensor)</span>${linea}</div>
    ${diag?`<div style="font-size:12px;color:var(--tinta2);margin-top:4px">Sensor: ${escaparHtml(diag)}</div>`:""}
  </div>`;
}

/* Hora real de una toma manual. Registros antiguos: la IA dejaba la hora de la medicion
   en el contexto ("09:56", "madrugada (06:25)") y la hora guardada era la del proceso
   — se veia "94 09:57 09:56". Si el contexto trae una hora, esa manda. */
function horaToma(g){
  const c = g.contexto||"";
  const ini = /^\s*\(?(\d{1,2}[:.]\d{2})\)?[\s,]*(.*)$/.exec(c);
  const fin = !ini && /^(.*?)[\s,]*\((\d{1,2}[:.]\d{2})\)\s*$/.exec(c);
  if(ini) return {hora: ini[1].replace(".",":"), ctx: ini[2]};
  if(fin) return {hora: fin[2].replace(".",":"), ctx: fin[1]};
  return {hora: g.hora, ctx: c};
}

/* Curva del dia del sensor (00-24 h) con la banda 70-180 y marcas en cada comida. Solo datos
   directos del sensor: las tomas manuales y pantallazos no se dibujan (decision de Marcelo, 02-10). Lo dudoso se ve distinto: baja confianza en tenue,
   artefactos como circulos vacios sin unir a la linea. Pieza autonoma: se puede mover. */
function curvaGlucosa(reg){
  const serie = ((reg&&reg.glucosa_sensor)||[]).filter(p=>p&&p.t&&typeof p.mg_dl==="number");
  if(serie.length < 2) return "";
  const W=320, H=128, iz=24, de=6, ar=8, ab=16, YMIN=40, YMAX=250, COLOR="#3E8E8A";
  const dia = new Date(serie[0].t); dia.setHours(0,0,0,0);
  const x = t => iz + (W-iz-de) * Math.min(1, Math.max(0, (new Date(t) - dia) / 864e5));
  const y = v => ar + (H-ar-ab) * (1 - (Math.min(YMAX, Math.max(YMIN, v)) - YMIN) / (YMAX - YMIN));
  const hhmm = h => { const [a,b] = String(h||"").split(":").map(Number); const d = new Date(dia); d.setHours(a||0, b||0); return d; };
  // Tramos: se corta la linea en los huecos (>25 min) y en los artefactos.
  const tramos = []; let actual = [], previo = null;
  for(const p of serie){
    const corte = p.calidad==="artefacto" || (previo && (new Date(p.t)-new Date(previo.t)) > 25*60000)
      || (previo && (previo.calidad==="baja_confianza") !== (p.calidad==="baja_confianza"));
    if(corte && actual.length){ tramos.push(actual); actual = []; }
    if(p.calidad!=="artefacto") actual.push(p);
    previo = p;
  }
  if(actual.length) tramos.push(actual);
  const lineas = tramos.map(tr => tr.length < 2 ? "" :
    `<polyline fill="none" stroke="${COLOR}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"
      ${tr[0].calidad==="baja_confianza"?'stroke-opacity=".4" stroke-dasharray="3 3"':""}
      points="${tr.map(p=>`${x(p.t).toFixed(1)},${y(p.mg_dl).toFixed(1)}`).join(" ")}"/>`).join("");
  const artefactos = serie.filter(p=>p.calidad==="artefacto").map(p =>
    `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.mg_dl).toFixed(1)}" r="2.6" fill="var(--tarjeta)" stroke="var(--tinta2)" stroke-width="1">
      <title>${p.mg_dl} mg/dl · artefacto (compresión nocturna)</title></circle>`).join("");
  // Comidas: agrupadas por hora; las casillas de suplementos y remedios no son comida.
  const comidas = {};
  for(const c of (reg.comidas||[])){
    if(!c.hora || (+c.kcal||0) < 20) continue;
    (comidas[c.hora] = comidas[c.hora] || []).push(c.descripcion||"");
  }
  const marcas = Object.entries(comidas).map(([h, ds]) => {
    const cx = x(hhmm(h)).toFixed(1);
    return `<g><line x1="${cx}" x2="${cx}" y1="${ar}" y2="${H-ab}" stroke="var(--macros)" stroke-width="1" stroke-opacity=".45"/>
      <circle cx="${cx}" cy="${H-ab}" r="3" fill="var(--macros)"/>
      <title>${h} · ${escaparHtml(ds.join(", "))}</title></g>`;
  }).join("");
  const ejeX = [0,6,12,18,24].map(h => `<text x="${(iz + (W-iz-de)*h/24).toFixed(1)}" y="${H-3}" font-size="8"
      text-anchor="middle" fill="var(--tinta2)">${String(h).padStart(2,"0")}</text>`).join("");
  const ejeY = [70,180].map(v => `<text x="${iz-4}" y="${(y(v)+3).toFixed(1)}" font-size="8" text-anchor="end"
      fill="var(--tinta2)">${v}</text>`).join("");
  return `<div class="barra"><div class="fila"><span>Curva de hoy</span>
      <small style="color:var(--tinta2)">banda 70–180 · ● comidas</small></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva de glucosa de hoy" style="display:block;margin-top:6px">
      <rect x="${iz}" y="${y(180).toFixed(1)}" width="${W-iz-de}" height="${(y(70)-y(180)).toFixed(1)}" fill="${COLOR}" fill-opacity=".08"/>
      <line x1="${iz}" x2="${W-de}" y1="${y(70).toFixed(1)}" y2="${y(70).toFixed(1)}" stroke="var(--linea)" stroke-width="1"/>
      <line x1="${iz}" x2="${W-de}" y1="${y(180).toFixed(1)}" y2="${y(180).toFixed(1)}" stroke="var(--linea)" stroke-width="1"/>
      ${ejeX}${ejeY}${marcas}${lineas}${artefactos}
    </svg></div>`;
}

function seccionCorrelaciones(corr){
  if(!corr||!corr.length) return "";
  const ICONO={medica:ico("estetoscopio",'style="width:16px;height:16px;vertical-align:-3px;color:var(--c-corazon)"'),
    accion:ico("rayo",'style="width:16px;height:16px;vertical-align:-3px;color:var(--c-micros)"'),
    info:ico("info",'style="width:16px;height:16px;vertical-align:-3px;color:var(--c-cuerpo)"')};
  return `<div class="tarjeta"><h2>Conexiones que veo</h2>` + corr.map(c=>`
    <div class="corr ${c.urgencia}">
      <div class="s">${ICONO[c.urgencia]||""} ${c.senal}</div>
      <div class="e">${c.evidencia}</div>
      <div class="h">${c.hipotesis}</div>
      <div class="a">→ ${c.accion}</div>
    </div>`).join("") +
    `<div style="font-size:11.5px;color:var(--tinta2)">Hipótesis con evidencia, no diagnósticos. Las marcadas con el estetoscopio van al médico.</div></div>`;
}

function tarjetaAlimentacion(al){
  if(!al||(!al.macros&&!al.micros&&!al.glucosa)) return "";
  const pct = v => v==null?"—":Math.round(v*100)+"%";
  let filas = "";
  if(al.macros) filas += `<div class="barra"><div class="fila"><span>Macronutrientes</span>
    <b>${al.macros.prot_ayer??"—"} g prot · ${al.macros.kcal_ayer??"—"} kcal</b></div>
    <div style="font-size:12px;color:var(--tinta2)">Ayer, contra metas 170-190 g y 1.500-2.100 kcal · tendencia 90 d: ${pct(al.macros.tendencia)}</div></div>`;
  if(al.micros) filas += `<div class="barra"><div class="fila"><span>Micronutrientes</span>
    <b>sodio ${al.micros.sodio_ayer??"—"} mg · fibra ${al.micros.fibra_ayer??"—"} g</b></div>
    <div style="font-size:12px;color:var(--tinta2)">Ayer, contra <2.300 mg y >=25 g · tendencia 90 d: ${pct(al.micros.tendencia)}</div></div>`;
  if(al.glucosa && !al.glucosa.calibrando) filas += `<div class="barra"><div class="fila"><span>Glucosa (sensor)</span>
    <b>${al.glucosa.prom_7d} mg/dl · ${al.glucosa.en_rango_pct}% en rango</b></div>
    <div style="font-size:12px;color:var(--tinta2)">${al.glucosa.n_lecturas} lecturas confiables en 7 días · rango 70-180
    ${al.glucosa.bajo_70?` · <span class="glu-baja">${String(al.glucosa.bajo_70_pct).replace(".",",")}% bajo 70</span>`:""}${al.glucosa.sobre_180?` · <span class="glu-alta">${String(al.glucosa.sobre_180_pct).replace(".",",")}% sobre 180</span>`:""}</div></div>`;
  return `<div class="tarjeta"><h2>Alimentación en detalle</h2>${filas}</div>`;
}

function tarjetaCardio(cardio){
  if(!cardio||(!cardio.fc_reposo&&!cardio.fc_trote&&!cardio.presion)) return "";
  const flecha = d => d==null?"":(d<0?` <span style="color:var(--micros)">↓${Math.abs(d)}</span>`
                                      :d>0?` <span style="color:var(--corazon)">↑${d}</span>`:" →");
  let filas = "";
  if(cardio.fc_reposo) filas += `<div class="barra"><div class="fila"><span>FC de reposo</span>
    <b>${cardio.fc_reposo.hoy} lpm${flecha(cardio.fc_reposo.delta)}</b></div>
    <div style="font-size:12px;color:var(--tinta2)">vs tu promedio de 30 días (${cardio.fc_reposo.promedio_30d||"—"}). Si baja con las semanas, tu cardio en reposo mejora.</div></div>`;
  if(cardio.fc_trote) filas += `<div class="barra"><div class="fila"><span>FC en el trote</span>
    <b>${cardio.fc_trote.ultima} lpm${flecha(cardio.fc_trote.delta)}</b></div>
    <div style="font-size:12px;color:var(--tinta2)">vs tus 3 trotes anteriores (${cardio.fc_trote.promedio_previas}). Menos pulsaciones al mismo esfuerzo = motor mejorando.</div></div>`;
  if(cardio.presion) filas += `<div class="barra"><div class="fila"><span>Presión arterial</span>
    <b>${cardio.presion.hoy||"—"}</b></div>
    <div style="font-size:12px;color:var(--tinta2)">Promedio 7 días: ${Math.round(cardio.presion.prom_7d_sis)}/${Math.round(cardio.presion.prom_7d_dia)} (${cardio.presion.n_tomas_7d} tomas). La semana es la señal; la toma del día es ruido.</div></div>`;
  return `<div class="tarjeta"><h2>Corazón en detalle</h2>${filas}</div>`;
}

function seccionHistorial(hist){
  if(!hist.length) return "";
  const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const filas = hist.map(r=>{
    const f = new Date(r.fecha+"T12:00:00");
    const a = r.acumulado||{};
    const entreno = (r.entrenamiento||[]).length>0;
    // Glucosa del día: solo lecturas confiables del sensor.
    const gl = (r.glucosa_sensor||[]).filter(p=>(p.calidad||"ok")==="ok").map(p=>p.mg_dl);
    const glMin = gl.length?Math.min(...gl):null;
    const glTxt = gl.length?` · glucosa ${glMin}–${Math.max(...gl)}`:"";
    return `<div class="dia-fila">
      <div class="dia-fecha"><div class="d">${f.getDate()}</div><div class="m">${MESES[f.getMonth()]}</div></div>
      <div class="dia-datos">
        <b>${Math.round(a.proteina_g||0)} g prot</b> · ${Math.round(a.kcal||0)} kcal · sodio ${Math.round(a.sodio_mg||0)} mg${glTxt}<br>
        ${r.sueno?("😴 "+String(r.sueno).split("(")[0].trim()+" · "):""}${(r.comidas||[]).length} comidas registradas
      </div>
      <div class="dia-marcas">
        ${entreno?'<span class="chip gym">GYM ✓</span>':""}
        ${r.peso_kg?`<span class="chip peso">${r.peso_kg} kg</span>`:""}
        ${glMin!=null&&glMin<70?'<span class="chip hipo">GLU baja</span>':""}
      </div>
    </div>`;
  }).join("");
  return `<div class="tarjeta"><h2>Cómo estuve cada día</h2>${filas}</div>`;
}

const ico = (n, extra="") => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${ICONOS[n]||""}</svg>`;

/* ---------- las 8 categorías: un color cada una, el mismo en toda la app ----------
   Mente, Social y Energía del diseño original no tenían datos: se reemplazaron por
   dimensiones que sí se miden (decisión de Marcelo, 02-10-2026). */
const CATEGORIAS = [
  {k:"descanso",    nombre:"Descanso",    lema:"Más recuperación", icono:"luna",    hex:"#5B4FA0", relojes:["descanso"],             grupo:"rendimiento"},
  {k:"corazon",     nombre:"Corazón",     lema:"Más resistencia",  icono:"corazon", hex:"#D4574A", relojes:["presion","fc_reposo"],  grupo:"salud"},
  {k:"nutricion",   nombre:"Nutrición",   lema:"Más equilibrio",   icono:"manzana", hex:"#3E8A4F", relojes:["macros"],               grupo:"energia"},
  {k:"metabolismo", nombre:"Metabolismo", lema:"Más eficiencia",   icono:"hoja",    hex:"#5FA27C", relojes:["glucosa"],              grupo:"energia"},
  {k:"cuerpo",      nombre:"Cuerpo",      lema:"Más fuerza",       icono:"pesa",    hex:"#2F6A96", relojes:["musculacion"],          grupo:"rendimiento"},
  {k:"composicion", nombre:"Composición", lema:"Menos grasa",      icono:"medidor", hex:"#C9653F", relojes:["grasa"],                grupo:"rendimiento"},
  {k:"micros",      nombre:"Micros",      lema:"Más vitalidad",    icono:"sol",     hex:"#D69631", relojes:["micros"],               grupo:"energia"},
  {k:"aerobico",    nombre:"Aeróbico",    lema:"Más capacidad",    icono:"pulso",   hex:"#4B7FA8", relojes:["fc_esfuerzo"],          grupo:"salud"},
];
const GRUPOS = [
  {k:"energia",     nombre:"Energía",     icono:"rayo",    hex:"#D69631"},
  {k:"salud",       nombre:"Salud",       icono:"corazon", hex:"#D4574A"},
  {k:"rendimiento", nombre:"Rendimiento", icono:"montana", hex:"#2F6A96"},
];
const NOMBRE_RELOJ = {presion:"Presión", fc_reposo:"FC de reposo", fc_esfuerzo:"FC en esfuerzo", macros:"Macronutrientes",
  micros:"Micronutrientes", glucosa:"Glucosa (sensor)", musculacion:"Entrenamiento", grasa:"Grasa corporal", descanso:"Sueño"};

function puntajeCategoria(rel, cat){
  const v = cat.relojes.map(k => rel[k] && rel[k].score).filter(s => s != null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function aclarar(hex, t){   // mezcla con blanco
  const n = parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  const m = c => Math.round(c + (255-c)*t);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

/* ---------- Withings: si no conecta se dice, con fecha (antes decía "sin datos") ---------- */
const DE_WITHINGS = new Set(["descanso", "corazon", "composicion", "aerobico"]);
function estadoWithings(){ return (DATOS && DATOS.estado && DATOS.estado.withings_estado) || null; }
function withingsCaido(){ const w = estadoWithings(); return !!(w && w.conexion && w.conexion.ok === false); }
function fechaCorta(iso){ return iso ? `${iso.slice(8,10)}-${iso.slice(5,7)}` : "—"; }
function bannerWithings(){
  if(!withingsCaido()) return "";
  const w = estadoWithings();
  return `<div class="banner-sistema banner-espera"><span><b>Withings: sin conexión desde el ${fechaCorta(w.sin_conexion_desde)}.</b>
    ${escaparHtml((w.conexion.motivo||"").slice(0,140))} Detalle en Configuración.</span></div>`;
}

/* ---------- la flor ---------- */
let FOCO_GRUPO = null;
function flor(rel, edad){
  const defs = [], hojas = [], petalos = [], etiquetas = [];
  // Hojas detrás de los pétalos: la identidad orgánica, sin ramas realistas.
  for(let i=0;i<8;i++){
    const a = i*45 + 22.5, largo = i%2 ? 176 : 190;
    hojas.push(`<g transform="rotate(${a})">
      <path d="M0,-62 C30,-92 34,${-largo+44} 0,${-largo} C-34,${-largo+44} -30,-92 0,-62Z" fill="${i%2?"#6E9A5B":"#58864C"}"/>
      <path d="M0,-66 L0,${-largo+8}" stroke="#A9C79A" stroke-width="1.2" opacity=".7"/></g>`);
  }
  CATEGORIAS.forEach((c, i) => {
    const s = puntajeCategoria(rel, c);
    const sin = s == null;
    const base = sin ? "#9EA59D" : c.hex;
    defs.push(`<linearGradient id="gp-${c.k}" gradientUnits="userSpaceOnUse" x1="0" y1="-60" x2="0" y2="-200">
      <stop offset="0" stop-color="${aclarar(base,.42)}"/><stop offset=".55" stop-color="${aclarar(base,.08)}"/><stop offset="1" stop-color="${base}"/></linearGradient>`);
    const a = i*45, rad = a*Math.PI/180, d = 132;
    const lx = (Math.sin(rad)*d).toFixed(1), ly = (-Math.cos(rad)*d).toFixed(1);
    // El puntaje se ve como intensidad, no como número (Inicio muestra estados).
    const op = sin ? 1 : (0.72 + 0.28*s).toFixed(2);
    petalos.push(`<g class="petalo" data-grupo="${c.grupo}" style="opacity:${op}" onclick="ir('arbol')" role="button"
        aria-label="${c.nombre}: ${sin?"sin datos":Math.round(s*100)+"%"}">
      <g transform="rotate(${a})"><path d="M0,-58 C64,-72 80,-152 0,-204 C-80,-152 -64,-72 0,-58Z" fill="url(#gp-${c.k})"
        stroke="${sin ? "rgba(31,42,36,.22)" : "rgba(255,255,255,.55)"}" stroke-width="1.2"/></g></g>`);
    etiquetas.push(`<g class="petalo" data-grupo="${c.grupo}" style="pointer-events:none">
      <g transform="translate(${lx},${ly})" fill="#fff" text-anchor="middle">
        <svg x="-13" y="-36" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">${ICONOS[c.icono]}</svg>
        <text y="6" font-size="15" font-weight="600" font-family="var(--sans)">${c.nombre}</text>
        <text y="22" font-size="10.5" opacity=".92" font-family="var(--sans)">${sin?(withingsCaido()&&DE_WITHINGS.has(c.k)?"Sin conexión":"Sin datos"):c.lema}</text>
      </g></g>`);
  });
  // Edad metabólica (edad_metabolica.py): índice de tendencia con dato duro. Sin cintura, no hay edad.
  const E = edad || null, P = (E && E.pantalla) || {};
  let centro;
  if(P.centro){
    centro = `
      <text y="-40" font-size="12.5" text-anchor="middle" fill="var(--tinta)">Edad</text>
      <text y="-25" font-size="12.5" text-anchor="middle" fill="var(--tinta)">metabólica</text>
      <text y="18" font-size="50" text-anchor="middle" font-family="var(--serif)" fill="var(--tinta)">${P.centro.anos}</text>
      <text y="34" font-size="11.5" text-anchor="middle" fill="var(--tinta)">años</text>
      <text y="51" font-size="11" text-anchor="middle" fill="var(--tinta)">${P.centro.meses} m ${P.centro.dias} d</text>
      ${P.por_confirmar_dias?`<text y="66" font-size="9" text-anchor="middle" fill="var(--tinta2)">${P.por_confirmar_dias} d por confirmar</text>`:""}`;
  }else{
    centro = `<text y="-14" font-size="12.5" text-anchor="middle" fill="var(--tinta)">Edad metabólica</text>
      <text y="8" font-size="13" text-anchor="middle" fill="var(--tinta2)">falta tu</text>
      <text y="25" font-size="13" text-anchor="middle" fill="var(--tinta2)">cintura</text>`;
  }
  return `<svg class="flor${FOCO_GRUPO?" foco-"+FOCO_GRUPO:""}" id="flor" viewBox="-215 -215 430 430" role="img"
      aria-label="Flor del bienestar: ocho dimensiones de tu salud">
    <defs>${defs.join("")}</defs>
    ${hojas.join("")}${petalos.join("")}${etiquetas.join("")}
    <g class="centro" onclick="ir('edad')" role="button" aria-label="Edad metabólica">
      <circle r="78" fill="#FFFDF8" stroke="rgba(255,255,255,.9)" stroke-width="4"/>${centro}</g>
  </svg>`;
}

function chipsHeroe(rel){
  return `<div class="chips-heroe">${GRUPOS.map(g => {
    const cats = CATEGORIAS.filter(c => c.grupo === g.k);
    const v = cats.map(c => puntajeCategoria(rel, c)).filter(s => s != null);
    const s = v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
    const C = 2*Math.PI*25;
    const prog = s == null ? "" : `<svg class="prog" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="none"
        stroke="${g.hex}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-s)).toFixed(1)}"
        transform="rotate(-90 28 28)" opacity=".85"/></svg>`;
    return `<button class="chip-h${FOCO_GRUPO===g.k?" activo":""}" onclick="enfocarGrupo('${g.k}')" aria-pressed="${FOCO_GRUPO===g.k}">
      <span class="circ" style="color:${g.hex}">${prog}${ico(g.icono,'style="width:26px;height:26px"')}</span>${g.nombre}</button>`;
  }).join("")}</div>`;
}

function enfocarGrupo(k){
  FOCO_GRUPO = FOCO_GRUPO === k ? null : k;
  const f = document.getElementById("flor");
  if(f) f.setAttribute("class", "flor" + (FOCO_GRUPO ? " foco-"+FOCO_GRUPO : ""));
  document.querySelectorAll(".chip-h").forEach(b => {
    const activo = b.getAttribute("onclick").includes(`'${FOCO_GRUPO}'`);
    b.classList.toggle("activo", activo); b.setAttribute("aria-pressed", activo);
  });
}

/* ---------- datos de la pasada (se pintan sin volver a pedirlos al cambiar de pantalla) ---------- */
let DATOS = null;   // {estado, regHoy, historial}

function metas(){
  const m = (DATOS && DATOS.estado && DATOS.estado.metas) || {};
  const num = (txt, cual) => { const v = String(txt||"").match(/\d+(?:[.,]\d+)?/g); return v ? +(cual==="max" ? v[v.length-1] : v[0]).replace(",",".") : null; };
  const rc = (DATOS && DATOS.estado && DATOS.estado.regla_carbos) || {};
  // Sodio: techo (o rango) con margen; el rojo aparece recién sobre la meta + margen (plan.json).
  const so = (m.sodio_mg && typeof m.sodio_mg === "object") ? m.sodio_mg : {max: 2300, margen_pct: 10};
  const sodio = +so.max || 2300, sodioAlerta = Math.round(sodio * (1 + (+so.margen_pct || 0)/100));
  return {prot: num(m.proteina_g) || 170, carbs: rc.meta_max_g || num(m.carbohidratos_g_entrenamiento, "max") || 100,
          netos: !!rc.netos, kcal: 2000, sodio, sodioAlerta};
}

/* ---------- tarjetas de Inicio ---------- */
function tarjetaEdad(edad){
  const P = (edad && edad.pantalla) || {};
  let cuerpo;
  if(!P.edad){
    cuerpo = `<p class="t-sub" style="margin-top:10px">${ico("hoja",'style="width:18px;height:18px;vertical-align:-4px;color:var(--c-metabolismo)"')}
      Falta tu cintura: escribe «cintura 98» en Registrar. ${edad && edad.cobertura ? `Datos: ${edad.cobertura}.` : ""}</p>`;
  }else{
    const sobre = (edad.brecha_dias||0) > 0;
    const c = P.cambios || {};
    const linea = ["7","14","30"].filter(n => c[n]).map(n => `${n} d: ${c[n].dias>0?"+":""}${c[n].dias}`).join(" · ");
    const serie = (edad.serie||[]).filter(x => x.brecha_dias != null).map(x => x.brecha_dias);
    cuerpo = `<div style="font-size:15px;margin-top:10px;color:${sobre?"#B4532F":"var(--acento)"}">${escaparHtml(P.brecha)}</div>
      ${linea?`<div class="t-sub">Cambio en días · ${linea}</div>`:""}
      <div class="t-sub">${escaparHtml(P.explicacion_hoy||"")}</div>
      ${P.nota_marcas?`<div class="t-sub">${escaparHtml(P.nota_marcas)}</div>`:""}
      ${serie.length >= 7 ? lineaMini(serie, sobre ? "#C9653F" : "#3E8A4F", 200, 60, true) : ""}`;
  }
  return `<button class="tarjeta" onclick="ir('edad')">
    <div class="t-titulo">Tu edad metabólica ${ico("info",'style="width:18px;height:18px;color:var(--tinta2)"')}</div>${cuerpo}</button>`;
}

function lineaMini(vals, color, W=100, H=34, relleno=false){
  if(!vals || vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), r = (max-min) || 1;
  const pts = vals.map((v,i) => [4 + (W-8)*i/(vals.length-1), 4 + (H-8)*(1-(v-min)/r)]);
  const d = pts.map(p => p.map(n=>n.toFixed(1)).join(",")).join(" ");
  const u = pts[pts.length-1];
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${relleno?`<polygon points="${pts[0][0]},${H} ${d} ${u[0]},${H}" fill="${color}" opacity=".1"/>`:""}
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${u[0].toFixed(1)}" cy="${u[1].toFixed(1)}" r="2.8" fill="${color}"/></svg>`;
}

/* Carbos netos del día (fase keto): la tabla USDA resta la fibra; las etiquetas ya son netas. */
function carbosNetos(reg){
  return Math.round(((reg && reg.comidas) || []).reduce((s, c) =>
    s + Math.max(0, (+c.carbohidratos_g||0) - (c.fuente === "tabla" ? (+c.fibra_g||0) : 0)), 0) * 10) / 10;
}

function anillosRegistro(reg){
  const a = (reg && reg.acumulado) || {}, m = metas();
  const ARS = [
    {n:"Proteína", v:a.proteina_g, meta:m.prot, color:"#E08A2C", icono:"cubiertos"},
    {n: m.netos ? "Carbos netos" : "Carbohidratos", v: m.netos ? carbosNetos(reg) : a.carbohidratos_g, meta:m.carbs,
     color:"#3E7BC4", icono:"espiga", tope: m.netos},
    {n:"Calorías", v:a.kcal, meta:m.kcal, color:"#3E8A4F", icono:"llama", icColor:"#E07B2C"},
    {n:"Sodio", v:a.sodio_mg, meta:m.sodio, color:"#8DB8E8", icono:"gota", tope:true, alerta:m.sodioAlerta},
  ];
  const C = 2*Math.PI*26;
  return `<div class="anillos4">${ARS.map(x => {
    const p = Math.max(0, Math.min(1, (x.v||0)/x.meta));
    const pasado = x.tope && (x.v||0) > (x.alerta || x.meta);
    return `<div class="a" title="${x.n}"><div class="r">
      <svg viewBox="0 0 62 62" aria-hidden="true"><circle cx="31" cy="31" r="26" fill="none" stroke="#EFECE6" stroke-width="5.5"/>
        <circle cx="31" cy="31" r="26" fill="none" stroke="${pasado?"#D4574A":x.color}" stroke-width="5.5" stroke-linecap="round"
          stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 31 31)"/></svg>
      <span class="ic" style="color:${x.icColor||x.color}">${ico(x.icono)}</span></div><span class="n">${x.n}</span></div>`;
  }).join("")}</div>`;
}

function tarjetaRegistroHoy(reg){
  return `<div class="tarjeta">
    <div class="t-titulo">${ico("sol",'style="color:#E9A23B"')}Registro de hoy
      <button class="boton" style="margin-left:auto" onclick="ir('registrar')">${ico("mas",'style="width:16px;height:16px"')}Añadir</button></div>
    <div id="hoy-en-vivo">${anillosRegistro(reg)}</div></div>`;
}

/* Glucosa de hoy, SOLO del sensor. El estado sale de las lecturas confiables. */
function estadoGlucosaHoy(reg){
  const serie = ((reg && reg.glucosa_sensor) || []);
  const ok = serie.filter(p => (p.calidad||"ok") === "ok");
  if(!serie.length) return {txt:"Sin datos", cls:"neutro"};
  if(ok.length < 12) return {txt:"Calibrando", cls:"neutro"};   // el mismo mínimo que el tablero: 3 h de señal
  if(ok.some(p => p.mg_dl < 70)) return {txt:"Bajo 70 hoy", cls:"atencion"};
  const enRango = ok.filter(p => p.mg_dl >= 70 && p.mg_dl <= 180).length / ok.length;
  return enRango >= .7 ? {txt:"En rango", cls:""} : {txt:"Fuera de rango", cls:"atencion"};
}

function curvaMini(reg){
  const serie = ((reg && reg.glucosa_sensor) || []).filter(p => p.calidad !== "artefacto");
  if(serie.length < 2) return "";
  const W=110, H=44, dia = new Date(serie[0].t); dia.setHours(0,0,0,0);
  const x = t => 3 + (W-6)*Math.min(1, Math.max(0, (new Date(t)-dia)/864e5));
  const y = v => 3 + (H-15)*(1 - (Math.min(250, Math.max(40, v))-40)/210);
  const pts = serie.map(p => `${x(p.t).toFixed(1)},${y(p.mg_dl).toFixed(1)}`).join(" ");
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <rect x="3" y="${y(180).toFixed(1)}" width="${W-6}" height="${(y(70)-y(180)).toFixed(1)}" fill="#5FA27C" opacity=".1"/>
    <line x1="3" x2="${W-3}" y1="${y(110).toFixed(1)}" y2="${y(110).toFixed(1)}" stroke="#5FA27C" stroke-dasharray="2 3" opacity=".6"/>
    <polyline points="${pts}" fill="none" stroke="#3E8A6A" stroke-width="1.4" stroke-linejoin="round"/>
    ${["00","06","12","18","24"].map((h,i)=>`<text x="${(3+(W-6)*i/4).toFixed(1)}" y="${H-1}" font-size="6.5" text-anchor="middle" fill="var(--tinta2)">${h}</text>`).join("")}
  </svg>`;
}

function tarjetaMiniGlucosa(reg){
  const e = estadoGlucosaHoy(reg);
  return `<button class="tarjeta" onclick="ir('glucosa')">
    <div class="t-titulo" style="font-size:15px"><span style="color:var(--c-metabolismo)">${ico("gota")}</span>Glucosa<span class="mas">${ico("derecha",'style="width:16px;height:16px"')}</span></div>
    <div style="text-align:right;margin-top:10px"><span class="estado ${e.cls}">${e.txt}</span></div>
    ${curvaMini(reg)}</button>`;
}

const TXT_PRESION = {normal:["En rango",""], elevada:["Elevada","atencion"], elevada_1:["Alta, etapa 1","atencion"], alta:["Alta","atencion"]};
function tarjetaMiniPresion(cardio){
  const pa = cardio && cardio.presion, serie = (cardio && cardio.presion_serie) || [];
  // Con menos de 4 tomas en 7 días no se interpreta el promedio: se pide medir a diario.
  const [txt, cls] = !pa ? ["Sin tomas","neutro"] : pa.pocas_tomas ? ["Mide a diario","neutro"]
    : (pa.categoria ? TXT_PRESION[pa.categoria] : ["Sin tomas","neutro"]);
  const max = Math.max(150, ...serie.map(t => t.sistolica));
  const barras = serie.map((t,i) => {
    const h = 30*(t.sistolica-60)/(max-60), xx = 4 + i*10.5;
    return `<rect x="${xx.toFixed(1)}" y="${(34-h).toFixed(1)}" width="6.5" height="${h.toFixed(1)}" rx="2"
      fill="#D4574A" opacity="${i===serie.length-1?.9:.32}"/>`;
  }).join("");
  return `<button class="tarjeta" onclick="ir('presion')">
    <div class="t-titulo" style="font-size:15px"><span style="color:var(--c-corazon)">${ico("corazon")}</span>Presión arterial<span class="mas">${ico("derecha",'style="width:16px;height:16px"')}</span></div>
    <div class="t-sub">Promedio 7 días${pa?` (${pa.n_tomas_7d} toma${pa.n_tomas_7d===1?"":"s"})`:""}</div>
    <div style="text-align:right;margin-top:6px"><span class="estado ${cls}">${txt}</span></div>
    ${serie.length?`<svg class="mini" viewBox="0 0 110 36" aria-hidden="true">${barras}</svg>`:""}</button>`;
}

function tarjetaMiniPeso(peso){
  const c = peso && peso.cambio_kg;
  const sube = c != null && c > 0;
  const chip = c == null ? `<span class="estado neutro">${peso?"Pocos pesajes":"Sin datos"}</span>`
    : `<span class="estado ${sube?"atencion":""}">${c>0?"+":""}${String(c).replace(".",",")} kg</span>`;
  return `<button class="tarjeta" onclick="ir('peso')">
    <div class="t-titulo" style="font-size:15px"><span style="color:var(--c-composicion)">${ico("balanza")}</span>Peso<span class="mas">${ico("derecha",'style="width:16px;height:16px"')}</span></div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px">
      ${c!=null&&c!==0?`<span style="color:${sube?"#D4574A":"var(--acento)"}">${ico(sube?"sube":"baja",'style="width:18px;height:18px"')}</span>`:""}${chip}</div>
    ${c!=null?`<div class="t-sub" style="text-align:right;margin-top:3px">en ${peso.cambio_dias} días</div>`:""}
    ${peso?lineaMini(peso.serie.map(x=>x.kg), "#D4574A", 110, 34):""}</button>`;
}

function horasDeSueno(txt){ const m = /(\d+)\s*h\s*(\d+)?/.exec(String(txt||"")); return m ? +m[1] + (+m[2]||0)/60 : null; }

function tarjetaHabitos(reg, estado){
  const rutina = String(estado.rutina_de_hoy || "");
  const descanso = /DESCANSO/i.test(rutina);
  const entreno = ((reg && reg.entrenamiento) || []).length > 0;
  const horas = horasDeSueno(reg && reg.sueno);
  const prot = +(((reg && reg.acumulado) || {}).proteina_g || 0), m = metas();
  const corto = t => { const s = t.replace(/^Semana \d+:\s*/,"").split(/[—.(]/)[0].trim(); return s.length>34 ? s.slice(0,32)+"…" : s; };
  const H = [
    {n:"Movimiento", icono:"pesa", color:"#D4574A", hecho: descanso || entreno, p: descanso||entreno ? 1 : 0,
     c: descanso ? "Día de descanso" : (corto(rutina) || "Sesión del plan")},
    {n:"Sueño", icono:"luna", color:"#5B4FA0", hecho: horas != null && horas >= 7, p: horas == null ? 0 : Math.min(1, horas/7),
     c: horas == null ? "Dormir 7 h o más" : `Dormir 7 h o más · anoche ${String(Math.round(horas*10)/10).replace(".",",")} h`},
    {n:"Nutrición", icono:"manzana", color:"#3E8A4F", hecho: prot >= m.prot, p: Math.min(1, prot/m.prot),
     c: `Proteína ${m.prot} g hoy`},
  ];
  const listos = H.filter(h => h.hecho).length;
  return `<div class="habitos">
    <div class="cab"><span style="color:var(--c-nutricion)">${ico("hoja")}</span><div class="t-titulo">Hábitos de hoy</div>
      <small>${listos} de 3 completados</small></div>
    <div class="rejilla-3" style="margin-bottom:0">${H.map(h => `<div class="habito">
      <div class="f"><span style="color:${h.color}">${ico(h.icono,'style="width:20px;height:20px"')}</span>${h.n}
        <span class="ok ${h.hecho?"si":""}">${h.hecho?ico("check",'style="width:13px;height:13px;stroke-width:2.4"'):""}</span></div>
      <div class="p"><i style="width:${Math.round(h.p*100)}%;background:${h.hecho?"var(--acento)":h.color}"></i></div>
      <div class="c">${escaparHtml(h.c)}</div></div>`).join("")}</div></div>`;
}

/* Un aviso para el médico no puede esconderse en otra pantalla: si existe, aparece aquí. */
function avisoMedico(estado){

  return `<button class="tarjeta aviso-medico" onclick="ir('tendencias')">${ico("estetoscopio")}

}

  if(g && g.calibrando){
    metr = `<p class="t-sub">Calibrando: hay ${g.n_lecturas} lecturas confiables; los números de 7 días aparecen con 3 horas de señal.</p>`;
  }else if(g){
    const m = (v, l) => `<div class="metrica"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    metr = `<div class="metricas">${m(g.prom_7d+" mg/dl","Promedio 7 días")}${m(g.en_rango_pct+"%","En rango 70–180")}

      ${Object.values(P.cambios||{}).map(c=>`<div class="t-sub">${escaparHtml(c.texto)}</div>`).join("")}

    </div>
    <div class="tarjeta"><h2>Por componente</h2>
      ${(P.desglose||[]).map(d=>fila(escaparHtml(d.nombre),
          `${d.aporta_dias>0?"+":""}${d.aporta_dias} días${d.por_ganar_dias?` · quedan ${d.por_ganar_dias} por ganar`:""}`)).join("")}
      ${P.mayor_palanca?`<p class="analisis" style="margin-top:6px"><b>Mayor palanca:</b> ${escaparHtml(P.mayor_palanca)}</p>`:""}
      ${(P.faltantes||[]).length?`<p class="nota">Sin dato (no se rellena): ${escaparHtml(P.faltantes.join(", "))}.</p>`:""}
      ${(E.congeladas||[]).length?`<p class="nota">Congeladas por evento de agua: ${E.congeladas.length} medición(es); no cuentan hasta que pase.</p>`:""}
      ${(E.atipicos||[]).length?`<p class="nota">Atípicas sin confirmar (no se usan): ${E.atipicos.map(a=>`${a.tipo} ${a.valor} (${a.fecha.slice(8)}/${a.fecha.slice(5,7)})`).join(", ")}.</p>`:""}

function barrasNutrientes(reg){
  if(!reg || !reg.acumulado) return "";
  const a = reg.acumulado, m = metas();
  const barra = (n,v,meta,color,unidad,invertir,alerta) => {
    const p = Math.min(1, invertir ? (v<=meta ? v/meta : 1) : v/meta);
    const exceso = invertir && v > (alerta || meta);
    return `<div class="barra"><div class="fila"><span>${n}</span><b style="color:${exceso?"var(--c-corazon)":"var(--tinta)"}">${Math.round(v)} / ${meta} ${unidad}</b></div>
      <div class="pista"><i style="width:${Math.round(p*100)}%;background:${exceso?"var(--c-corazon)":color}"></i></div></div>`;
  };
  return `${barra("Proteína", a.proteina_g||0, m.prot, "#E08A2C", "g")}
    ${m.netos ? barra("Carbos netos (keto)", carbosNetos(reg), m.carbs, "#3E7BC4", "g", true)
              : barra("Carbohidratos", a.carbohidratos_g||0, m.carbs, "#3E7BC4", "g")}
    ${barra("Calorías", a.kcal||0, m.kcal, "#3E8A4F", "kcal")}
    ${barra("Sodio", a.sodio_mg||0, m.sodio, "#8DB8E8", "mg", true, m.sodioAlerta)}
    ${barra("Fibra", a.fibra_g||0, 25, "var(--c-nutricion)", "g")}
    ${barra("Potasio", a.potasio_mg||0, 3500, "var(--c-micros)", "mg")}
    ${barra("Magnesio", a.magnesio_mg||0, 420, "var(--c-metabolismo)", "mg")}
    ${barra("Vitamina D", a.vitamina_d_ug||0, 15, "var(--c-micros)", "µg")}`;
}
