<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice">
  <!-- Paisaje provisorio (lago, montañas, bosque, luz de mañana) hasta tener la foto real:
       se reemplaza dejando app/img/paisaje.jpg y cambiando la variable foto-heroe del CSS. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9DCE6"/><stop offset=".45" stop-color="#E9E6DA"/><stop offset="1" stop-color="#F3EBDC"/>
    </linearGradient>
    <radialGradient id="sol" cx=".78" cy=".2" r=".45">
      <stop offset="0" stop-color="#FFF6DE" stop-opacity=".95"/><stop offset="1" stop-color="#FFF6DE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lago" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7D7DC"/><stop offset="1" stop-color="#A9C0C6"/>
    </linearGradient>
    <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EFE6" stop-opacity="0"/><stop offset="1" stop-color="#F3EFE6" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#cielo)"/>
  <rect width="600" height="700" fill="url(#sol)"/>
  <path d="M0 330 L70 280 L130 300 L210 240 L280 290 L350 250 L430 300 L520 260 L600 290 V420 H0Z" fill="#AEBFC6" opacity=".75"/>
