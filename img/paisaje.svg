  <path d="M0 430 C120 425 240 438 360 432 C450 428 530 436 600 433" stroke="#E8EEF0" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M0 500 L30 470 L45 490 L70 455 L95 488 L120 462 L150 495 L180 470 L215 500 L250 478 L290 505 L340 490 L400 512 L470 498 L540 515 L600 505 V700 H0Z" fill="#5E7E62"/>
  <path d="M0 560 L25 520 L50 550 L80 505 L110 548 L140 515 L175 560 L215 530 L260 570 L320 548 L380 580 L450 560 L520 585 L600 570 V700 H0Z" fill="#3F6247"/>
  <rect y="380" width="600" height="320" fill="url(#niebla)"/>
